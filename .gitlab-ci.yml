stages:
  - .pre
  - build
  - test
  - release

variables:
  REGISTRY_HOST: registry.dane.gov.pl
  REGISTRY: ${REGISTRY_HOST}/mcod/frontend
  REGISTRY_USER: gitlab-ci-token
  IMAGE: frontend
  # intermediate images
  DEPENDENCIES_IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}-dependencies
  BUILD_IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}-build
  # versions
  NODE_VERSION: "20"
  DOCKER_VERSION: "28-dind"
  # runtime
  VERSION_FILE: version.txt
  RELEASE_DOCKER_BUILD_TARGET: serve-static

# prevent running branch pipelines for open MRs
# https://docs.gitlab.com/ci/yaml/workflow/#switch-between-branch-pipelines-and-merge-request-pipelines
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# region .pre
get-version:
  stage: .pre
  image: node:${NODE_VERSION}-alpine
  script:
    - PACKAGE_VERSION=$(node -p -e "require('./package.json').version")
    - echo "${PACKAGE_VERSION}" > ${VERSION_FILE}
  artifacts:
    paths:
      - ${VERSION_FILE}
    expire_in: 30 days
  tags:
    - docker
# endregion

# region build
build-images:
  image: docker:${DOCKER_VERSION}
  stage: build
  before_script:
    - echo "Image target=dependencies name=${REGISTRY}/${IMAGE}:${DEPENDENCIES_IMAGE_TAG}"
    - docker login -u $REGISTRY_USER -p $CI_JOB_TOKEN $REGISTRY_HOST
  script:
    - > 
      docker build --progress=plain 
      --target dependencies 
      --tag ${REGISTRY}/${IMAGE}:${DEPENDENCIES_IMAGE_TAG}
      .
    - docker push ${REGISTRY}/${IMAGE}:${DEPENDENCIES_IMAGE_TAG}
  tags:
    - docker
# endregion

# region test
test: &test-job
  image: ${REGISTRY}/${IMAGE}:${DEPENDENCIES_IMAGE_TAG}
  stage: test
  before_script:
    - cp -r /usr/src/mcod/node_modules ./node_modules # PWD in gitlab it not the same as WORKDIR
  script:
    - npm run test
  tags:
    - docker
  rules:
    # do not run for tagged build
    - if: $CI_COMMIT_TAG
      when: never
    # do not run on release'able branches
    - if: $CI_COMMIT_BRANCH == 'master' || $CI_COMMIT_BRANCH == 'pre-develop'
      when: never
    # do not run on merge requests during release: develop -> master or develop -> pre-develop
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'develop'
      when: never
    # do not run on schedule
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    # run on merge requests
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success

lint:
  <<: *test-job
  script:
    - npm run lint
  allow_failure: true
# endregion

# region build and release templates
release-job: &release-job
  # Builds the package for release and pushes it to the BUILD_IMAGE_TAG image
  # Tags the BUILD_IMAGE_TAG with environment specific tags, eg.: pre-dev, pre-dev-3.0.1
  # Pushes these new tags to the Registry
  # Child jobs need to set
  # - variables
  # - rules
  stage: release
  image: docker:${DOCKER_VERSION}
  tags:
    - docker
  before_script:
    - PACKAGE_VERSION=$(cat ${VERSION_FILE})
    - echo "PACKAGE_VERSION=${PACKAGE_VERSION}"
    - echo "Image target=${RELEASE_DOCKER_BUILD_TARGET} name=${REGISTRY}/${IMAGE}:${BUILD_IMAGE_TAG}"
    - echo "Image name=${REGISTRY}/${IMAGE}:${IMAGE_TAG}"
    - echo "Image name=${REGISTRY}/${IMAGE}:${IMAGE_TAG}-${PACKAGE_VERSION}"
    - docker login -u $REGISTRY_USER -p $CI_JOB_TOKEN $REGISTRY_HOST
  script:
    - echo "Building image to ${REGISTRY}/${IMAGE}:${IMAGE_TAG} with command"
    - >
      echo docker build --progress=plain 
      --build-arg MCOD_BUILD_CONFIGURATION_ENV=${MCOD_BUILD_CONFIGURATION_ENV}
      --target ${RELEASE_DOCKER_BUILD_TARGET} 
      --tag ${REGISTRY}/${IMAGE}:${BUILD_IMAGE_TAG}
      --tag ${REGISTRY}/${IMAGE}:${IMAGE_TAG}
      --tag ${REGISTRY}/${IMAGE}:${IMAGE_TAG}-${PACKAGE_VERSION}
      --push
      .
    - >
      docker build --progress=plain 
      --build-arg MCOD_BUILD_CONFIGURATION_ENV=${MCOD_BUILD_CONFIGURATION_ENV}
      --target ${RELEASE_DOCKER_BUILD_TARGET} 
      --tag ${REGISTRY}/${IMAGE}:${BUILD_IMAGE_TAG}
      --tag ${REGISTRY}/${IMAGE}:${IMAGE_TAG}
      --tag ${REGISTRY}/${IMAGE}:${IMAGE_TAG}-${PACKAGE_VERSION}
      --push
      .
  variables:
    MCOD_BUILD_CONFIGURATION_ENV: FILL_IN_LATER
    IMAGE_TAG: FILL_IN_LATER
  rules:
    - when: never
# endregion

# region environments
release-pre-dev:
  <<: *release-job
  variables:
    MCOD_BUILD_CONFIGURATION_ENV: int
    IMAGE_TAG: pre-dev
  rules:
    # run on push to develop
    - if: $CI_COMMIT_BRANCH == 'develop'
    # run on push to pre-develop
    - if: $CI_COMMIT_BRANCH == 'pre-develop'
    # do not run on merge requests during release: develop -> master
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'develop'
      when: never
    # run on merge requests otherwise, but ask for confirmation
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual

release-int:
  <<: *release-job
  variables:
    MCOD_BUILD_CONFIGURATION_ENV: int
    IMAGE_TAG: dev
  rules:
    # run on develop automatically
    - if: $CI_COMMIT_BRANCH == 'develop'
      when: on_success

release-preprod:
  <<: *release-job
  variables:
    MCOD_BUILD_CONFIGURATION_ENV: production
    IMAGE_TAG: master
  rules:
    # run on master automatically
    - if: $CI_COMMIT_BRANCH == 'master'
      when: on_success

release-prod:
  <<: *release-job
  variables:
    MCOD_BUILD_CONFIGURATION_ENV: production
    IMAGE_TAG: master-prod-latest
  rules:
    # run on master, only after previous release worked, and ask for confirmation
    - if: $CI_COMMIT_BRANCH == 'master'
      when: manual
# endregion

# region publish code
publish-code:
  <<: *release-job
  script:
    - cd /gluster/mcod/code
    - git archive --output frontend_$PACKAGE_VERSION.zip -9 HEAD
    - ln -sf frontend_$PACKAGE_VERSION.zip frontend_latest.zip
  rules:
    # run on master, but ask for confirmation
    - if: $CI_COMMIT_BRANCH == 'master'
      when: manual
# endregion
