<section class="home-section--news vertical-spacing" id="news">
  <h2 class="heading heading--md heading--separator heading--centered">
    {{ 'Home.News.Title' | translate }}
  </h2>

  <div>
    <!-- api notifications -->
    <app-notifications></app-notifications>

    <!-- NEWS LIST -->
    <ul class="row home-news row-cols-1 row-cols-md-2">
      <li class="home-news__item col" *ngFor="let item of items">
        <h3 class="home-news__item-heading heading heading--sm">
          <a [routerLink]="['/!article' | localize, item.attributes.slug]" [innerHtml]="item.attributes.title"> </a>
        </h3>

        <!-- created -->
        <p class="home-news__item-date">
          {{ item?.attributes?.created | translateDateFormat | async }}
        </p>

        <!-- excerpt (description) -->
        <p class="home-news__item-excerpt" [innerHtml]="item.attributes.notes | stripHtml | truncateText: 220"></p>

        <!-- read more -->
        <a class="home-news__item-read-more with-chevron" [routerLink]="['/!article' | localize, item.attributes.slug]">
          {{ 'Home.News.ReadMore' | translate }}
          <span class="visually-hidden">
            {{ 'Connector.About' | translate }}
            {{ item.attributes.title }}
          </span>
          <svg class="icon icon-chevrons-right" role="img" aria-hidden="true">
            <use href="/assets/icomoon/sprite/sprite.svg#icon-chevrons-right"></use></svg
        ></a>
      </li>
    </ul>

    <!-- view all (anchor) -->
    <home-section-footer [routerURL]="'/!article'" [text]="'Home.News.All'"></home-section-footer>
  </div>
</section>
