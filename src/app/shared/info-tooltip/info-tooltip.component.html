<button
  type="button"
  [appTooltip]="text"
  [title]="title"
  [style.color]="iconColor"
  class="info-tooltip ml-2"
  placement="bottom"
  [attr.aria-label]="'Hint' | translate"
>
  <svg class="icon icon-info" height="20" width="20">
    <use [attr.xlink:href]="'/assets/icomoon/sprite/sprite.svg#icon-info'"></use>
  </svg>
</button>
